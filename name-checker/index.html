<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Name Checker: the first website I ever built. Enter a name and validate its length.">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Name Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pj">
    <a class="skip-link" href="#main">Skip to content</a>
<div class="backdrop" aria-hidden="true"></div>

<nav class="site-nav" aria-label="Main">
    <span class="site-nav-name">Abdalla</span>
    <div class="site-nav-right">
        <a href="../portfolio-site/index.html" class="site-nav-link"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H4M10 16l-6-6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> All projects</a>
        <button class="theme-toggle" id="themeToggle" type="button"></button>
    </div>
</nav>

    <main class="page app-layout" id="main">
        <div class="app-main">

            <div class="card">

                <!-- Header -->
                <div class="card-header">
                    <p class="eyebrow">project 01</p>
                    <h1 class="title">Name <span class="acc">Checker</span></h1>
                    <p class="subtitle">Is your name long enough? Let's find out.</p>
                </div>

                <!-- Input area -->
                <div class="input-area">
                    <div class="input-wrap" id="inputWrap">
                        <input
                            type="text"
                            id="text_in"
                            class="name-input"
                            placeholder="Type your name…"
                            maxlength="32"
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <div class="char-bar">
                            <div class="char-fill" id="charFill"></div>
                        </div>
                    </div>

                    <div class="input-meta">
                        <span class="char-count" id="charCount">0 / 4 characters</span>
                        <span class="validity" id="validity"></span>
                    </div>
                </div>

                <!-- Submit -->
                <button class="submit-btn" id="submitBtn" disabled>
                    <span id="btnLabel">Enter a name first</span>
                </button>

                <!-- Result -->
                <div class="result hidden" id="result" aria-live="polite">
                    <div class="result-icon" id="resultIcon">✓</div>
                    <p class="result-text" id="resultText">That's a great name!</p>
                    <button class="try-again" id="tryAgain">Try another →</button>
                </div>

            </div>

            <p class="footer-note">My first ever website, rebuilt.</p>
        </div>
        <div class="stage" data-object="name-checker" data-accent="#22d3ee" aria-hidden="true"><span class="stage-fallback">01</span></div>
    </main>

<footer class="site-footer">
    <div class="site-footer-line">
        <p>© 2026 Abdalla</p>
        <p>Built with curiosity.</p>
    </div>
</footer>


    <script src="../shared/theme.js"></script>
<script src="../shared/motion.js"></script>
<script src="script.js"></script>
<script type="module" src="../shared/gl/studio.js"></script>
</body>
</html>
