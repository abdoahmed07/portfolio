<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Name Checker: the first website I ever built. Enter a name and validate its length.">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Name Checker</title>
    <script>(function(){var t;try{t=localStorage.getItem('theme');}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="../shared/site.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pj">
    <a class="skip-link" href="#main">Skip to content</a>

<nav class="site-nav" aria-label="Main">
    <a class="site-nav-name" href="../portfolio-site/index.html">Abdalla</a>
    <div class="site-nav-right">
        <a href="../portfolio-site/index.html#projects" class="site-nav-link">All projects</a>
        <button class="theme-toggle" id="themeToggle" type="button"></button>
    </div>
</nav>

    <main class="page app-layout" id="main">
        <div class="app-main">

            <div class="card">

                <!-- Header -->
                <div class="card-header">
                    <p class="eyebrow">project 01</p>
                    <h1 class="title">Name <span class="acc">Checker</span></h1>
                    <p class="subtitle">Is your name long enough? Let's find out.</p>
                </div>

                <!-- Input area -->
                <div class="input-area">
                    <div class="input-wrap" id="inputWrap">
                        <input
                            type="text"
                            id="text_in"
                            class="name-input"
                            placeholder="Type your name…"
                            maxlength="32"
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <div class="char-bar">
                            <div class="char-fill" id="charFill"></div>
                        </div>
                    </div>

                    <div class="input-meta">
                        <span class="char-count" id="charCount">0 / 4 characters</span>
                        <span class="validity" id="validity"></span>
                    </div>
                </div>

                <!-- Submit -->
                <button class="submit-btn" id="submitBtn" disabled>
                    <span id="btnLabel">Enter a name first</span>
                </button>

                <!-- Result -->
                <div class="result hidden" id="result" aria-live="polite">
                    <div class="result-icon" id="resultIcon">✓</div>
                    <p class="result-text" id="resultText">That's a great name!</p>
                    <button class="try-again" id="tryAgain">Try another →</button>
                </div>

            </div>

            <p class="footer-note">My first ever website, rebuilt.</p>
        </div>
    </main>

<footer class="site-footer">
    <div class="site-footer-line">
        <p>© 2026 Abdalla</p>
        <a href="../portfolio-site/index.html#apps">All projects</a>
    </div>
</footer>


    <script src="../shared/site.js"></script>
<script src="script.js"></script>
</body>
</html>
